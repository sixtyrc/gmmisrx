name: Deploy a produccion

on:
  push:
    branches: [prod]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Sube filter_app/version.txt segun los commits nuevos (ver scripts/bump_version.py)
  # y lo commitea en prod antes del deploy. Los pushes hechos con GITHUB_TOKEN no
  # disparan otro workflow, asi que no hay loop.
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Calcular y commitear nueva version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 scripts/bump_version.py
          git push origin HEAD:${{ github.ref_name }}
      - name: Llevar el commit de version a dev (solo si es fast-forward)
        run: |
          git fetch origin dev
          if git merge-base --is-ancestor origin/dev HEAD; then
            git push origin HEAD:dev
          else
            echo "dev tiene commits que prod no tiene; se sincroniza en el proximo merge a prod."
          fi

  deploy:
    needs: version
    runs-on: self-hosted
    env:
      # Ruta donde esta clonado el repo EN EL SERVER (ajustar via Settings > Actions >
      # Variables > DEPLOY_PATH si es distinta a la de docs/DEPLOY.md).
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || 'C:\www\gmmisrx' }}
      NSSM_SERVICE: ${{ vars.NSSM_SERVICE || 'gmmisrx-panel' }}

    steps:
      - name: Actualizar codigo (git reset --hard, no toca .env/logs/padron_archivos)
        shell: powershell
        run: |
          cd "$env:DEPLOY_PATH"
          git fetch origin
          git reset --hard "origin/${{ github.ref_name }}"

      - name: Instalar dependencias
        shell: powershell
        run: |
          cd "$env:DEPLOY_PATH\filter_app"
          .\venv\Scripts\python -m pip install --upgrade "pip>=26.2.2"
          .\venv\Scripts\pip install -r requirements.txt

      - name: Migraciones
        shell: powershell
        run: |
          cd "$env:DEPLOY_PATH\filter_app"
          .\venv\Scripts\python manage.py migrate --noinput

      - name: Recolectar archivos estaticos (admin de Django, via Whitenoise)
        shell: powershell
        run: |
          cd "$env:DEPLOY_PATH\filter_app"
          .\venv\Scripts\python manage.py collectstatic --noinput

      - name: Reiniciar servicio del panel (NSSM)
        shell: powershell
        run: |
          nssm restart $env:NSSM_SERVICE
