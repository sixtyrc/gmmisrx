<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso restringido - Gestión MisRx</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563EB;
            --primary-hover: #1D4ED8;
            --bg-color: #F0F4F8;
            --card-bg: #FFFFFF;
            --text-main: #0F172A;
            --text-muted: #64748B;
            --border-color: #E2E8F0;
            --error: #EF4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .wrapper { display: flex; flex-direction: column; align-items: center; }
        .brand { margin-bottom: 20px; }
        .brand img { height: 44px; }
        .card {
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
            padding: 40px 36px;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .icono {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: #FEF2F2;
            color: var(--error);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin: 0 auto 20px;
        }
        .card h1 { font-size: 19px; font-weight: 700; margin-bottom: 10px; color: var(--text-main); }
        .card p { font-size: 14px; color: var(--text-muted); line-height: 1.5; margin-bottom: 28px; }
        .btn {
            display: inline-block;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
        }
        .btn:hover { background: var(--primary-hover); }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="brand">
            <img src="https://ss-static-01.esmsv.com/id/163038/galeriaimagenes/obtenerimagen/?width=277&height=64&id=sitio_logo&ultimaModificacion=2026-08-03+11%3A32%3A28" alt="GM Salud">
        </div>
        <div class="card">
            <div class="icono">&#128274;</div>
            <h1>Acceso restringido</h1>
            <p>
                {% if exception %}{{ exception }}{% else %}No tenés permisos para acceder a esta página.{% endif %}
            </p>
            <a href="/padron/" class="btn">Ir al panel</a>
        </div>
    </div>
</body>
</html>
