<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión MisRx - Iniciar sesión</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563EB;
            --primary-hover: #1D4ED8;
            --bg-color: #F0F4F8;
            --card-bg: #FFFFFF;
            --text-main: #0F172A;
            --text-muted: #64748B;
            --border-color: #E2E8F0;
            --error: #EF4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 4px;
        }
        .brand img { height: 44px; }
        .brand-title { font-size: 22px; font-weight: 700; }
        .brand-title .misrx { color: var(--primary); }
        .subtitle { color: var(--text-muted); font-size: 14px; margin-bottom: 28px; }
        .card {
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
            padding: 40px 36px;
            width: 100%;
            max-width: 360px;
        }
        .card h1 { font-size: 20px; font-weight: 600; margin-bottom: 24px; color: var(--text-main); }
        .field { margin-bottom: 20px; }
        .field label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 6px; }
        .field input {
            width: 100%;
            border: none;
            border-bottom: 1px solid var(--border-color);
            padding: 8px 2px;
            font-size: 15px;
            font-family: inherit;
            outline: none;
        }
        .field input:focus { border-bottom-color: var(--primary); }
        .btn {
            width: 100%;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }
        .btn:hover { background: var(--primary-hover); }
        .errores { color: var(--error); font-size: 13px; margin-bottom: 16px; }
        .wrapper { display: flex; flex-direction: column; align-items: center; }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="brand">
            <img src="https://ss-static-01.esmsv.com/id/163038/galeriaimagenes/obtenerimagen/?width=277&height=64&id=sitio_logo&ultimaModificacion=2026-08-03+11%3A32%3A28" alt="GM Salud">
        </div>
        <div class="subtitle">Gestión MisRx</div>
        <div class="card">
            <h1>Iniciar sesión</h1>
            {% if form.errors %}
                <div class="errores">Usuario o contraseña incorrectos.</div>
            {% endif %}
            <form method="post">
                {% csrf_token %}
                <div class="field">
                    <label for="id_username">Usuario</label>
                    <input type="text" name="username" id="id_username" autofocus required>
                </div>
                <div class="field">
                    <label for="id_password">Contraseña</label>
                    <input type="password" name="password" id="id_password" required>
                </div>
                <input type="hidden" name="next" value="{{ next }}">
                <button type="submit" class="btn">Iniciar sesión</button>
            </form>
        </div>
    </div>
</body>
</html>
